[pytest]
testpaths = tests
# Tests import `backend.*`; without this they only work with PYTHONPATH set.
pythonpath = .
asyncio_mode = auto
addopts = -m "not live and not db"
markers =
    live: makes a real Anthropic API call; run with `pytest -m live`
    db: runs against the real Postgres and the real clock; run with `pytest -m db`
